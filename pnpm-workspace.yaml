packages:
  - packages/*

# Both are transitive under @modelcontextprotocol/sdk and both patches sit inside the ranges its
# deps already declare (ajv wants fast-uri ^3.0.1, express-rate-limit wants ip-address ^10.2.0),
# so this pins the floor rather than forcing an incompatible version. Without it a future
# lockfile refresh can resolve back down into the vulnerable range.
#   fast-uri   <3.1.6   GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
#                             GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp
#                             host confusion and SSRF normalization flaws
#   ip-address <10.3.1  GHSA-mwp4-54f8-5fhr  leading-zero octet decoding, SSRF / trust-boundary bypass
#
# The SDK accepts hono ^4.11.4 and @hono/node-server ^1.19.9 || ^2.0.5. The fixed
# Node adapter is 2.1.3 (GHSA-rmxm-3fg6-px4f); its Node >=20 requirement is also
# the stdio bridge's supported minimum. Keep this runtime dependency patched.
#   hono              <4.12.34  GHSA-f23p-vx2j-j53r  memo() retains SSR output across requests
#                               GHSA-54fx-42gc-7vw4  algorithmic-complexity DoS in language middleware
#                               GHSA-8j4g-w8fx-2239  ReDoS in CORS middleware via ACRH
#   @hono/node-server <2.1.3  GHSA-rmxm-3fg6-px4f  double-decoded static paths bypass middleware
overrides:
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  hono: ^4.13.11
  '@hono/node-server': 2.1.3
  proxy-addr: ^2.0.8
  qs: ^6.16.1
  zod@4: ^4.6.7
  body-parser@2: ^2.4.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - agentmail
  - agentmail-toolkit

peerDependencyRules:
  ignoreMissing:
    - pg
    - redis
    - better-sqlite3
